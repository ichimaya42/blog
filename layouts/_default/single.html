<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ site.Title }}</title>
    
    <!-- MathJax -->
    <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      }
    };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
    
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6; 
        color: #333;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
    }
    header { 
        border-bottom: 2px solid #e1e1e1; 
        padding-bottom: 1rem; 
        margin-bottom: 2rem; 
    }
    .post-header { margin-bottom: 2rem; }
    .post-meta { color: #666; margin-top: 0.5rem; }
    .draft-badge { 
        background: #ffd700; 
        color: #000; 
        padding: 0.2rem 0.5rem; 
        border-radius: 4px; 
        font-size: 0.8rem; 
        margin-left: 1rem; 
    }
    .post-content { 
        font-size: 1.1rem;
        line-height: 1.8;
        margin-bottom: 3rem;
    }
    .post-content h2 { margin: 2rem 0 1rem 0; }
    .post-content h3 { margin: 1.5rem 0 0.75rem 0; }
    .post-content p { margin: 1rem 0; }
    .post-content ul, .post-content ol { margin: 1rem 0 1rem 2rem; }
    .MathJax { font-size: 1.1em; }
    footer { 
        margin-top: 3rem; 
        padding-top: 1rem; 
        border-top: 1px solid #e1e1e1; 
        color: #666; 
    }
    .back-link { display: inline-block; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <header>
        <h1><a href="/" style="text-decoration: none; color: inherit;">{{ site.Title }}</a></h1>
        <p>Step-by-step physics solutions</p>
    </header>

    <main>
        <a href="/" class="back-link">← Back to all solutions</a>
        
        <article class="post">
            <header class="post-header">
                <h1>{{ .Title }}</h1>
                <div class="post-meta">
                    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
                    {{ if .Params.draft }}<span class="draft-badge">DRAFT</span>{{ end }}
                </div>
            </header>

            <div class="post-content">
                {{ .Content }}
            </div>

            <footer class="post-footer">
                <div id="comments">
                    <p><em>Comment system will be added soon</em></p>
                </div>
            </footer>
        </article>
    </main>

    <footer>
        <p>&copy; {{ now.Format "2006" }} {{ site.Title }}</p>
    </footer>
</body>
</html>
